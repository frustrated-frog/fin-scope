<h2>设计风格选择</h2>
<p class="subtitle">请选择你偏好的整体设计风格（单选）</p>

<div class="options">
  <div class="option" data-choice="modern-minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>现代简约风格</h3>
      <p>干净利落的线条、大量留白、精致的微动效，类似 Notion、Linear 的设计语言</p>
    </div>
  </div>

  <div class="option" data-choice="glassmorphism" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>玻璃拟态风格</h3>
      <p>半透明毛玻璃效果、柔和渐变、深度层次感，现代感强烈，类似 Apple、Fluent Design</p>
    </div>
  </div>

  <div class="option" data-choice="neo-brutalism" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>新粗野主义</h3>
      <p>大胆的色块、粗重边框、强对比度、不规则布局，个性鲜明有艺术感</p>
    </div>
  </div>

  <div class="option" data-choice="premium-dark" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>高端深色模式</h3>
      <p>深色背景配高对比度文字、金色/绿色点缀、奢华感强，适合金融投资类应用</p>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 2rem;">
  <h3>当前风格特点</h3>
  <p class="subtitle">你的应用目前是浅色主题，绿色主色调，风格偏简洁专业</p>
</div>
