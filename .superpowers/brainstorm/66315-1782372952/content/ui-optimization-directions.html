<h2>UI 优化方向选择</h2>
<p class="subtitle">请选择你最希望优化的方面（可以多选）</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="visual-design" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>视觉设计升级</h3>
      <p>现代化配色方案、渐变效果、阴影、圆角、图标等视觉元素升级</p>
    </div>
  </div>

  <div class="option" data-choice="interactions" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>交互动效增强</h3>
      <p>添加平滑过渡动画、悬停效果、加载状态、反馈动画等交互体验</p>
    </div>
  </div>

  <div class="option" data-choice="layout" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>布局结构优化</h3>
      <p>改进信息层级、空间利用、组件排列、响应式布局等结构设计</p>
    </div>
  </div>

  <div class="option" data-choice="components" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>组件细节打磨</h3>
      <p>优化按钮、表单、卡片、表格等组件的细节设计和状态反馈</p>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 2rem;">
  <h3>当前界面风格</h3>
  <p class="subtitle">你的应用目前采用了简洁的浅色主题，带有绿色调的配色方案</p>
</div>
