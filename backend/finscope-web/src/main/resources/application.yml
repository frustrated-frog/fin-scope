server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:../data/finance.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=30000

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"

finscope:
  data-root: ${FINSCOPE_DATA_ROOT:../data}
  cors-origin: ${FINSCOPE_CORS_ORIGIN:http://localhost:*}
  logging:
    slow-request-ms: ${FINSCOPE_SLOW_REQUEST_MS:2000}
  llm:
    enabled: ${FINSCOPE_LLM_ENABLED:false}
    base-url: ${FINSCOPE_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${FINSCOPE_LLM_API_KEY:}
    model: ${FINSCOPE_LLM_MODEL:}
    timeout-ms: ${FINSCOPE_LLM_TIMEOUT_MS:300000}
    temperature: ${FINSCOPE_LLM_TEMPERATURE:0.2}
  search:
    enabled: ${FINSCOPE_SEARCH_ENABLED:false}
    provider: ${FINSCOPE_SEARCH_PROVIDER:tavily}
    api-key: ${FINSCOPE_SEARCH_API_KEY:}
  python-market-data:
    base-url: ${FINSCOPE_PYTHON_MARKET_DATA_BASE_URL:http://127.0.0.1:8000}
