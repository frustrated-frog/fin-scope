server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:../data/finance.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=30000

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"

finscope:
  data-root: ../data
  cors-origin: http://localhost:*
  llm:
    enabled: true
    base-url: "https://api.letmyai.com/v1"
    api-key: "sk-letmyai-08-c8c2d4b34676ecbe6ca375aecf5550e9229cc00e6980df7a"
    model: "gpt-5.5"
    timeout-ms: 300000
    temperature: 0.2
  search:
    enabled: ${FINSCOPE_SEARCH_ENABLED:true}
    provider: tavily
    api-key: ${FINSCOPE_SEARCH_API_KEY:}
