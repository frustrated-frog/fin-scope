server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  datasource:
    url: jdbc:sqlite:../data/finance.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=30000

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"

finscope:
  data-root: ../data
  cors-origin: http://localhost:*
  llm:
    enabled: ${FINSCOPE_LLM_ENABLED:true}
    base-url: ${FINSCOPE_LLM_BASE_URL:https://modelservice.jdcloud.com/v1}
    api-key: "pk-1439bbdb-a7a8-47d3-a7f1-0d9e3bd103ea"
    model: ${FINSCOPE_LLM_MODEL:GLM-5}
    timeout-ms: ${FINSCOPE_LLM_TIMEOUT_MS:300000}
    temperature: ${FINSCOPE_LLM_TEMPERATURE:0.2}
  search:
    enabled: ${FINSCOPE_SEARCH_ENABLED:true}
    provider: ${FINSCOPE_SEARCH_PROVIDER:tavily}
    api-key: "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"
  python-market-data:
    base-url: ${FINSCOPE_PYTHON_MARKET_DATA_BASE_URL:http://127.0.0.1:8000}
  market-data:
    fresh-cache-ms: ${FINSCOPE_MARKET_DATA_FRESH_CACHE_MS:15000}
    hedge-delay-ms: ${FINSCOPE_MARKET_DATA_HEDGE_DELAY_MS:300}
    request-budget-ms: ${FINSCOPE_MARKET_DATA_REQUEST_BUDGET_MS:5000}
    max-intraday-fallback-age-seconds: ${FINSCOPE_MARKET_DATA_MAX_FALLBACK_AGE_SECONDS:120}
    warmup-enabled: ${FINSCOPE_MARKET_DATA_WARMUP_ENABLED:true}
    warmup-interval-ms: ${FINSCOPE_MARKET_DATA_WARMUP_INTERVAL_MS:10000}
  quant:
    market-data-sync-cron: ${FINSCOPE_QUANT_MARKET_DATA_SYNC_CRON:0 30 18 * * MON-FRI}
