server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  datasource:
    url: jdbc:sqlite:../data/finance.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=30000

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"

finscope:
  data-root: ../data
  cors-origin: http://localhost:*
  llm:
    enabled: true
    base-url: http://llm-gw.jd.local/v1
    api-key: ecacd6e33a5b4ca3a6ae1f0a3ebf3da0
    model: GPT-5.5-joybuilder
    timeout-ms: 300000
    temperature: 1
  search:
    enabled: true
    provider: tavily
    api-key: "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"
    any-search:
      enabled: true
      api-key: ""
      base-url: https://api.anysearch.com
      timeout-ms: 15000
      max-response-bytes: 2097152
    fusion:
      rrf-constant: 60
      max-per-domain: 2
      concurrency: 2
  python-market-data:
    base-url: http://127.0.0.1:8000
  acquisition:
    browser:
      enabled: false
      executable: ""
      timeout-ms: 20000
      max-response-bytes: 8388608
      max-concurrency: 1
  market-data:
    capital-max-lag-minutes: 15
    fresh-cache-ms: 15000
    hedge-delay-ms: 300
    request-budget-ms: 5000
    capital-request-budget-ms: 20000
    max-intraday-fallback-age-seconds: 120
    warmup-enabled: false
    warmup-interval-ms: 60000
  quant:
    market-data-sync-cron: 0 30 18 * * MON-FRI
