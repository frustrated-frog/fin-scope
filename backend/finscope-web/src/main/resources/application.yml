server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  datasource:
    url: jdbc:sqlite:../data/finance.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=30000
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 1000ms

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"

management:
  health:
    redis:
      enabled: false

finscope:
  data-root: ../data
  cors-origin: http://localhost:*
  redis:
    enabled: true
    cache:
      research-material-ttl-seconds: 240
  news:
    refresh-initial-delay-ms: 1000
    refresh-interval-ms: 30000
    source-snapshot-ttl-seconds: 120
  llm:
    enabled: true
    base-url: https://modelservice.jdcloud.com/v1
    api-key: pk-1439bbdb-a7a8-47d3-a7f1-0d9e3bd103ea
    model: GLM-5
    timeout-ms: 300000
    temperature: 0.2
  search:
    enabled: true
    provider: tavily
    api-key: "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"
    any-search:
      enabled: true
      api-key: "as_sk_8bd8463e8068b211c142bd684bdbcdf8"
      base-url: https://api.anysearch.com
      timeout-ms: 15000
      max-response-bytes: 2097152
    fusion:
      rrf-constant: 60
      max-per-domain: 2
      concurrency: 2
  python-market-data:
    base-url: http://127.0.0.1:8000
  acquisition:
    browser:
      enabled: false
      executable: ""
      timeout-ms: 20000
      max-response-bytes: 8388608
      max-concurrency: 1
  market-data:
    capital-max-lag-minutes: 15
    fresh-cache-ms: 15000
    hedge-delay-ms: 300
    request-budget-ms: 5000
    capital-request-budget-ms: 20000
    max-intraday-fallback-age-seconds: 120
    warmup-enabled: false
    warmup-interval-ms: 60000
  quant:
    market-data-sync-cron: 0 30 18 * * MON-FRI
  radar:
    refresh-initial-delay-ms: 15000
    refresh-interval-ms: 300000
