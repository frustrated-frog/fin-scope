services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - finscope-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  market-data:
    build:
      context: ./market-data-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - finscope-market-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/finscope-web/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      market-data:
        condition: service_started
    environment:
      FINSCOPE_DATA_ROOT: /data
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  finscope-redis:
  finscope-market-data:
