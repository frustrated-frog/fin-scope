<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#1e40af" stroke-width="1"/>

  <!-- Chart trend line -->
  <path d="M 6 22 L 11 18 L 16 14 L 21 16 L 26 8"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Magnifying glass (research symbol) -->
  <circle cx="12" cy="10" r="4" stroke="white" stroke-width="1.5" fill="none"/>
  <line x1="15" y1="13" x2="18" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
