[project]
name = "finscope-market-data"
version = "0.1.0"
description = "FinScope A-share market data acquisition service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ecosystem = [
    "akshare>=1.17",
    "pytdx>=1.72",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finscope_market_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
